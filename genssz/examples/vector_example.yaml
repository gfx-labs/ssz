package: vectorexample

# Example schema demonstrating vector field types in genssz
structs:
  # Basic numeric vectors
  - name: NumericVectors
    type: container
    children:
      - name: small_ints
        type: vector
        size: 8
        children:
          - type: uint16
      - name: medium_ints
        type: vector
        size: 4
        children:
          - type: uint32
      - name: large_ints
        type: vector
        size: 2
        children:
          - type: uint64

  # Vectors of references
  - name: Coordinate
    type: container
    children:
      - name: x
        type: uint32
      - name: y
        type: uint32
      - name: z
        type: uint32

  - name: Path
    type: container
    children:
      - name: waypoints
        type: vector
        size: 10
        children:
          - type: ref
            ref: Coordinate

  # Mixed container with various vector types
  - name: GameState
    type: container
    children:
      - name: player_id
        type: uint64
      - name: scores
        type: vector
        size: 5
        children:
          - type: uint32
      - name: positions
        type: vector
        size: 5
        children:
          - type: ref
            ref: Coordinate
      - name: checksum
        type: bytevector
        size: 32