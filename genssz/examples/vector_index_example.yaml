package: indexexample

# Example showing index-based accessor generation for vectors
structs:
  - name: DataArray
    type: container
    children:
      # Basic numeric vector
      - name: values
        type: vector
        size: 10
        children:
          - type: uint32
      
      # Bytevector (special case of vector[N] of uint8)
      - name: data
        type: bytevector
        size: 32
      
  - name: Point3D
    type: container
    children:
      - name: x
        type: uint32
      - name: y
        type: uint32
      - name: z
        type: uint32
  
  - name: PointCloud
    type: container
    children:
      # Vector of references
      - name: points
        type: vector
        size: 100
        children:
          - type: ref
            ref: Point3D