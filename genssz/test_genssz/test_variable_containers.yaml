package: testvarcontainer
structs:
  - name: Transaction
    type: container
    children:
      - name: nonce
        type: uint64
      - name: gas_price
        type: uint64
      - name: gas_limit
        type: uint64
      - name: to
        type: bytes
        limit: 20  # Address is typically 20 bytes max
      - name: value
        type: uint64
      - name: data
        type: bytes
        limit: 1024  # Transaction data
      - name: v
        type: uint8
      - name: r
        type: uint32
      - name: s
        type: uint32
  
  - name: Block
    type: container
    children:
      - name: slot
        type: uint64
      - name: proposer_index
        type: uint64
      - name: parent_root
        type: bytevector
        size: 32
      - name: state_root
        type: bytevector
        size: 32
      - name: transactions
        type: list
        limit: 100
        children:
          - type: bytes
            limit: 2048
      - name: attestations
        type: list
        limit: 128
        children:
          - type: uint64