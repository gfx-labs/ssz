---
package: testlistdynamic

structs:
  - name: DynamicItem
    type: container
    children:
      - name: id
        type: uint64
      - name: data
        type: bytes
        limit: 256
        
  - name: ContainerWithDynamicList
    type: container
    children:
      - name: count
        type: uint32
      - name: items
        type: list
        limit: 100
        children:
          - type: ref
            ref: DynamicItem