---
package: testref

structs:
  - name: FixedData
    fields:
      - name: value
        type: uint64
      - name: flag
        type: bool
        
  - name: VariableData
    fields:
      - name: count
        type: uint32
      - name: items
        type: bytes
        limit: 1024
        
  - name: ContainerWithRefs
    fields:
      - name: id
        type: uint64
      - name: fixed_ref
        type: ref
        ref: FixedData
      - name: variable_ref
        type: ref
        ref: VariableData